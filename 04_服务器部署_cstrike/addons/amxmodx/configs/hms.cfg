// HNS Movement Suite 2.0.0-beta1
// SQL credentials intentionally live in hms_sql.cfg, not in plugin cvars.
// Start with SQL disabled. Import/migrate the schema and protect the credential file before enabling it.

hms_enabled 1
hms_sql_enabled 0
hms_sql_timeout 0

// Three grouped HUD panels use one global scheduler. The configured interval is a base;
// movement/status panels are slower, and update rates are throttled from observed frame rate.
hms_hud_interval 0.10

// Movement event thresholds (GoldSrc units per second).
hms_low_speed_threshold 180.0
hms_low_speed_drop 45.0
hms_bhop_fog_frames 6

// Server-wide jump/chat/sound policy. Personal preferences can switch these off individually.
hms_enable_jumpstats 1
hms_show_landing 1

// 0 = result only for the jumper; 1 = broadcast results to receivers who enabled chat results.
hms_chat_broadcast 0
hms_sound_takeoff 1
hms_sound_landing 1
hms_sound_achievement 1
hms_sound_distance 250.0

// Optional per-jump SQL events are off by default to avoid unbounded table growth.
hms_sql_save_jump_events 0
