; ============================================================
; HnsMatchSkin 刀皮商店价格配置
; ------------------------------------------------------------
; 刀"模型本体"仍由 crxknives 引擎的 configs/KnifeModels.ini 提供,
; 这里只覆盖【商店里显示/收取的价格】, 方便单独管理:
;   - 刀名必须和 KnifeModels.ini 里的 [段名] 完全一致
;   - 价格 0 = 免费
;   - 前 knife_free 把 (skins.cfg [SETTINGS]) 永远免费, 不受这里影响
;   - 没写在这里的刀, 回退用 KnifeModels.ini 里的 PRICE
;
; 格式 (一行 = 一把刀):
;   刀名  价格
;
; 购买租期由 skins.cfg 的 rent_days 控制 (默认 30 天 = 一个月)。
; 例:
;   cso刀       300
;   爪子刀女手   500
; ============================================================

; 下面把当前 KnifeModels.ini 里已有的刀列出来, 价格按需改
; ([Default] 是原版刀, 通常是第一把免费的, 不用写)

cso刀        300
爪子刀女手    300
无影(女手)    300
黑墨         300
白莲蝴蝶      500
卡兰比特      300
蝴蝶刺客      300
钻石镐        500
透明刀        300
透明刀(绿色)   400
透明刀(橙色)   400
透明刀(白色)    400
炫彩蝴蝶      500
紫外线        500
键盘          200
幽灵刀        200
